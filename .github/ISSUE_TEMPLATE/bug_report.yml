name: Bug report
description: Report a reproducible problem with DRH - Scene Material Inventory.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Use this form for a problem you can reproduce. Include enough detail for another person to follow the same steps.

  - type: input
    id: addon_version
    attributes:
      label: Add-on version
      description: Enter the installed DRH - Scene Material Inventory version.
      placeholder: "Example: 1.0.0"
    validations:
      required: true

  - type: input
    id: blender_version
    attributes:
      label: Blender version
      placeholder: "Example: 4.2.1"
    validations:
      required: true

  - type: dropdown
    id: operating_system
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true

  - type: dropdown
    id: installation_method
    attributes:
      label: Installation method
      options:
        - Blender Preferences > Add-ons > Install from Disk
        - Marketplace download
        - Manual ZIP install
        - Other
    validations:
      required: true

  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to reproduce
      description: List the shortest sequence that reproduces the problem.
      placeholder: |
        1. Open Blender
        2. Enable the add-on
        3. Run the affected workflow
        4. Observe the problem
    validations:
      required: true

  - type: textarea
    id: expected_result
    attributes:
      label: Expected result
    validations:
      required: true

  - type: textarea
    id: actual_result
    attributes:
      label: Actual result
    validations:
      required: true

  - type: textarea
    id: error_message
    attributes:
      label: Error output or screenshot
      description: Paste relevant console output or attach a screenshot. Remove private paths or project information when necessary.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I can reproduce the problem consistently.
          required: true
