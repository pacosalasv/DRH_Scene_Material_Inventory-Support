name: Bug report
description: Report a reproducible problem in DRH - Scene Material Inventory.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug in DRH - Scene Material Inventory.

        Please complete the details below so the issue can be reproduced and reviewed.

  - type: input
    id: addon_version
    attributes:
      label: Add-on version
      description: What version of DRH - Scene Material Inventory are you using?
      placeholder: "Example: 1.0.0"
    validations:
      required: true

  - type: input
    id: blender_version
    attributes:
      label: Blender version
      placeholder: "Example: 4.2.1"
    validations:
      required: true

  - type: dropdown
    id: operating_system
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true

  - type: dropdown
    id: installation_method
    attributes:
      label: Installation method
      options:
        - Blender Preferences > Add-ons > Install from Disk
        - Marketplace download
        - Manual ZIP install
        - Other
    validations:
      required: true

  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Blender
        2. Enable the add-on
        3. Open the panel
        4. Trigger the problem
    validations:
      required: true

  - type: textarea
    id: expected_result
    attributes:
      label: Expected result
    validations:
      required: true

  - type: textarea
    id: actual_result
    attributes:
      label: Actual result
    validations:
      required: true

  - type: textarea
    id: error_message
    attributes:
      label: Error message, console output, or screenshot

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues before opening this report.
          required: true
        - label: I can reproduce this issue consistently.
          required: true
